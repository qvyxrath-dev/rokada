 var a=pc(RK[i][0],"w");$("hav").innerHTML=a;$("mav").innerHTML=a}
function ev(g){
 if(g.in_checkmate())return g.turn()==="w"?-1e4:1e4;if(g.in_draw())return 0;
 var s=0,b=g.board();
 for(var r=0;r<8;r++)for(var c=0;c<8;c++){var x=b[r][c];if(x)s+=(x.color==="w"?1:-1)*(V[x.type]+(x.type==="p"?(x.color==="w"?(6-r):(r-1))*0.05:0)+((r>1&&r<6&&c>1&&c<6)?0.05:0))}
 return s}
function srch(g,d,a,b){
 if(d===0||g.game_over())return ev(g);
 var ms=g.moves(),w=g.turn()==="w",best=w?-1e5:1e5;
 for(var i=0;i<ms.length;i++){g.move(ms[i]);var v=srch(g,d-1,a,b);g.undo();
  if(w){if(v>best)best=v;if(best>a)a=best}else{if(v<best)best=v;if(best<b)b=best}
  if(a>=b)break}
 return best}
function scored(depth){var w=G.turn()==="w",out=[];
 G.moves({verbose:true}).forEach(function(m){G.move(m);out.push({m:m,v:srch(G,depth-1,-1e5,1e5)});G.undo()});
 out.sort(function(x,y){return w?y.v-x.v:x.v-y.v});return out}
function botMove(cb){var d=DF[+prof.diff],ms=G.moves({verbose:true}),t0=Date.now();
 if(!ms.length){cb(null);return}
 var rg=[[800,2000],[1200,3200],[1800,4500]][+prof.diff],cx=Math.min(1,ms.length/30),tt=ms.length===1?500:(rg[0]+(rg[1]-rg[0])*Math.random()*(.35+.65*cx))*(G.history().length<4?.6:1);
 function done(m){setTimeout(function(){cb(m)},Math.max(0,tt-(Date.now()-t0)))}
 if(Math.random()<d.rnd){done(ms[Math.random()*ms.length|0]);return}
 var dep=d.lv===1?1:3,out=[],i=0;
 (function step(){var n=0;while(i<ms.length&&n<3){G.move(ms[i]);out.push({m:ms[i],v:srch(G,dep-1,-1e5,1e5)});G.undo();i++;n++}
  if(i<ms.length){setTimeout(step,0);return}
  out.sort(function(x,y){return x.v-y.v});
  var tp=out.filter(function(x){return x.v===out[0].v});done(tp[Math.random()*tp.length|0].m)})()}
function bar(){var e=Math.max(-12,Math.min(12,ev(G)));$("ev").firstChild.style.width=(100/(1+Math.exp(-e/4)))+"%"}
function draw(anim){var na=noAnim;noAnim=false;
 var b=G.board(),tgt={},ks=null;
 if(sel)G.moves({square:sel,verbose:true}).forEach(function(m){tgt[m.to]=1});
 if(G.in_check())for(var r=0;r<8;r++)for(var c=0;c<8;c++){var x=b[r][c];if(x&&x.type==="k"&&x.color===G.turn())ks="abcdefgh"[c]+(8-r)}
 var h="";
 for(var r=0;r<8;r++)for(var c=0;c<8;c++){
  var sq="abcdefgh"[c]+(8-r),x=b[r][c],cl="sq "+((r+c)%2?"d":"l");
  if(lm&&(lm.from===sq||lm.to===sq))cl+=" lm";if(sel===sq)cl+=" sel";if(ks===sq)cl+=" chk";if(tgt[sq])cl+=x?" cap":" hint";
  h+='<div class="'+cl+'" data-s2="'+sq+'">'+(c===0?'<span class="co r">'+(8-r)+'</span>':'')+(r===7?'<span class="co f">'+sq[0]+'</span>':'')+(x?pc(x.type,x.color):'')+'</div>'}
 $("board").innerHTML=h;bar();
 if(anim&&lm&&!na){var to=document.querySelector('[data-s2="'+lm.to+'"]'),p=to&&to.querySelector(".pc");
  if(p){var dx=lm.from.charCodeAt(0)-lm.to.charCodeAt(0),dy=lm.to.charCodeAt(1)-lm.from.charCodeAt(1);
   to.classList.add("anim");p.style.transition="none";p.style.transform="translate("+dx*100+"%,"+dy*100+"%)";void p.offsetWidth;
   p.style.transition="transform .28s cubic-bezier(.2,.8,.2,1)";p.style.transform="none";setTimeout(function(){to.classList.remove("anim")},320)}}
 turnUI()}
function status(){
 if(G.in_checkmate()){over=true;var win=G.turn()==="b",g=30*(+prof.diff+1);if(win&&mode==="game")addXp(g);snd(win?"win":"lose");return win?t("c_win",g):t("c_lose")}
 if(G.game_over()){over=true;return t("c_draw")}
 return G.in_check()?t("c_check"):""}
function tap(sq){if(busy||over)return;var p=G.get(sq);
 if(sel&&sel!==sq){var mv=G.moves({square:sel,verbose:true}).filter(function(m){return m.to===sq})[0];if(mv){play(mv);return}}
 sel=(p&&p.color==="w"&&G.turn()==="w")?sq:null;draw()}
function turnUI(){var my=G.turn()==="w"&&!over,op=G.turn()==="b"&&!over&&mode==="game";
 $("tm").textContent=my?t("your_turn"):"";
 $("tb").innerHTML=op?t("opp_turn")+'<span class="dd"><i></i><i></i><i></i></span>':""}
function sqAt(e){var r=$("board").getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x<0||x>=1||y<0||y>=1)return null;return "abcdefgh"[x*8|0]+(8-(y*8|0))}
function legal(f,to){return G.moves({square:f,verbose:true}).filter(function(m){return m.to===to})[0]}
function endDrag(){if(!drag)return;if(drag.g&&drag.g.parentNode)drag.g.parentNode.removeChild(drag.g);var o=document.querySelector('[data-s2="'+drag.from+'"] .pc');if(o)o.style.opacity="";var h=document.querySelector(".sq.hov");if(h)h.classList.remove("hov");drag=null}
function moveGhost(e){var w=drag.w;drag.g.style.left=(e.clientX-w/2)+"px";drag.g.style.top=(e.clientY-w/2-(e.pointerType==="touch"?w*.7:0))+"px"}
var bd=$("board");
bd.addEventListener("pointerdown",function(e){ac();if(busy||over||e.button>0)return;var sq=sqAt(e);if(!sq)return;
 if(sel&&sel!==sq){var mv=legal(sel,sq);if(mv){e.preventDefault();play(mv);return}}
 var p=G.get(sq);
 if(p&&p.color==="w"&&G.turn()==="w"){sel=sq;draw();drag={from:sq,g:null,w:0,sx:e.clientX,sy:e.clientY};try{bd.setPointerCapture(e.pointerId)}catch(x){}}
 else{sel=null;draw()}});
bd.addEventListener("pointermove",function(e){if(!drag)return;
 if(!drag.g){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;var o=document.querySelector('[data-s2="'+drag.from+'"] .pc');if(!o){drag=null;return}
  var w=o.getBoundingClientRect().width,g=document.createElement("div");g.className="ghost";g.style.width=w+"px";g.style.height=w+"px";g.innerHTML=o.outerHTML;document.body.appendChild(g);o.style.opacity=".3";drag.g=g;drag.w=w}
 moveGhost(e);var s=sqAt(e),h=document.querySelector(".sq.hov");
 if(h&&h.getAttribute("data-s2")!==s)h.classList.remove("hov");
 if(s&&!document.querySelector(".sq.hov")){var q=document.querySelector('[data-s2="'+s+'"]');if(q)q.classList.add("hov")}});
bd.addEventListener("pointerup",function(e){if(!drag)return;var d=drag;
 if(d.g){var to=sqAt(e),mv=to&&to!==d.from?legal(d.from,to):null;endDrag();if(mv){noAnim=true;play(mv)}else draw()}else endDrag()});
bd.addEventListener("pointercancel",function(){if(drag){endDrag();draw()}});
function play(mv){
 sel=null;
 if(mode==="puzzle"){
  var m=G.move({from:mv.from,to:mv.to,promotion:"q"});
  if(m.san.replace(/[+#]/g,"")===pz.sol){lm=m;if(!done[pz.fen]){done[pz.fen]=1;addXp(20)}say(t("c_pok"));over=true;snd("win")}
  else{G.undo();snd("err");say(t("c_pwrong"))}
  draw(over);return}
 var sc=scored(2),best=sc[0],me=sc.filter(function(x){return x.m.from===mv.from&&x.m.to===mv.to})[0];
 var loss=me?Math.abs(best.v-me.v):0;
 lm=G.move({from:mv.from,to:mv.to,promotion:"q"});fx(lm);
 if(loss<0.3){say(t("c_good"));addXp(2)}
 else if(loss<1.5)say(t("c_inacc",loss.toFixed(1),best.m.san));
 else say(t("c_err",loss.toFixed(1),best.m.san));
 draw(true);var s=status();if(over){say(s);turnUI();return}
 busy=true;setBot();var id=gid;
 botMove(function(m){if(id!==gid)return;if(m){lm=G.move(m);fx(lm)}busy=false;setBot();draw(true);var s2=status();if(s2)say(s2);turnUI()})}
function setBot(){$("bn").textContent=t("bot")+" · "+t("d"+prof.diff);$("bav").innerHTML=pc("n","b");$("bav").style.background="var(--acc)";$("mn").textContent=nm()}
function newGame(){gid++;G=new Chess();sel=null;lm=null;over=false;busy=false;mode="game";setBot();say(t("c_start"),1);draw()}
function loadP(i){gid++;pz=P[i];G=new Chess(pz.fen);sel=null;lm=null;over=false;busy=false;mode="puzzle";show("play");$("bn").textContent=t("nav_puz");$("bav").innerHTML=pc("n","b");$("bav").style.background="var(--acc)";$("mn").textContent=nm();say(pz.t[prof.lang],1);draw()}
function seg(n,o,c){return '<div class="seg">'+o.map(function(x){return '<button data-st="'+n+':'+x[0]+'" class="'+(x[0]===c?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>'}
function diffSeg(){return seg("diff",[["0",t("d0")],["1",t("d1")],["2",t("d2")]],prof.diff)}
function coachSeg(){return seg("cg",[["m",t("boy")+" · "+COACH[prof.lang].m],["f",t("girl")+" · "+COACH[prof.lang].f]],prof.cg)}
function langSeg(){return seg("lang",[["ru","Русский"],["en","English"]],prof.lang)}
function renderSetup(){$("s_t").textContent=t("s_t");$("s_l").textContent=t("s_l");$("s_c").textContent=t("s_c");$("go").textContent=t("s_go");$("s_lang").outerHTML='<div id="s_lang">'+langSeg()+'</div>';$("s_coach").outerHTML='<div id="s_coach">'+coachSeg()+'</div>'}
function renderHome(){var n=0;P.forEach(function(p){if(done[p.fen])n++});var di=Math.floor(Date.now()/864e5)%P.length;
 $("hm").innerHTML='<div class="hero"><b style="font-size:18px">'+t("h_play")+'</b><p>'+t("h_pick")+'</p>'+diffSeg()+'<button class="go" data-act="bot">'+t("play_bot")+'</button></div>'+
 '<div class="card pz"><div><b>'+t("daily")+'</b><div class="sub">'+P[di].t[prof.lang]+'</div></div><button class="btn2" data-p="'+di+'">'+t("solve")+'</button></div>'+
 '<div class="card pz"><div><b>'+t("learn")+'</b><div class="sub">'+t("learn_sub")+'</div></div><button class="btn2" data-v="learn">'+t("open")+'</button></div>'+
 '<div class="card sub">'+t("stats",n,P.length,xp)+'</div>'}
function renderList(){$("list").innerHTML=P.map(function(p,i){return '<div class="card pz"><span class="'+(done[p.fen]?"ok":"")+'">'+(done[p.fen]?t("solved"):"")+p.t[prof.lang]+'</span><button class="btn2" data-p="'+i+'">'+t("solve")+'</button></div>'}).join("")}
function renderLearn(){$("ln").innerHTML='<div class="card"><b>'+t("coach_t")+'</b><div class="sub" style="margin:4px 0">'+t("coach_d")+'</div>'+coachSeg()+'</div>'+LS.map(function(l){return '<div class="card"><b>'+l.t[prof.lang]+'</b><p class="sub">'+l.x[prof.lang]+'</p><button class="btn2" '+(l.p!==undefined?'data-p="'+l.p+'">'+t("practice"):'data-act="bot">'+t("playb"))+'</button></div>'}).join("")}
function renderMe(){$("me").innerHTML='<div class="card rank"><span class="av big">'+nm()[0]+'</span><div><b>'+nm()+'</b><div class="sub">'+(prof.reg&&prof.tid?t("reg_tg"):t("reg_g"))+'</div></div></div>'+
 '<div class="card"><b>'+t("s_l")+'</b>'+langSeg()+'<b>'+t("th")+'</b>'+seg("theme",[["auto",t("th_auto")],["light",t("th_light")],["dark",t("th_dark")]],prof.theme)+'<b>'+t("s_c")+'</b>'+coachSeg()+'<b>'+t("h_pick")+'</b>'+diffSeg()+'<b>'+t("snd")+'</b>'+seg("snd",[["1",t("on")],["0",t("off")]],prof.snd)+'<b>'+t("voice")+'</b>'+seg("voice",[["1",t("on")],["0",t("off")]],prof.voice)+'</div>'}
function applyTheme(){var r=document.documentElement;if(prof.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",prof.theme);r.lang=prof.lang}
function chips(){}
function labels(){var b=document.querySelectorAll("#nb button"),k=["home","play","puz","learn","me"];b.forEach(function(x,i){x.textContent=t("nav_"+k[i])});
 $("hintBtn").textContent=t("hint");$("newBtn").textContent=t("newg");$("h_puz").textContent=t("nav_puz");$("h_learn").textContent=t("learn");$("h_me").textContent=t("nav_me")}
function show(v){cur=v;["setup","home","play","puz","learn","me"].forEach(function(x){$("v_"+x).hidden=x!==v});
 $("nb").hidden=v==="setup";
 document.querySelectorAll("#nb button").forEach(function(b){b.className=b.getAttribute("data-v")===v?"on":""});
 ({setup:renderSetup,home:renderHome,puz:renderList,learn:renderLearn,me:renderMe,play:chips})[v]()}
function refresh(){applyTheme();labels();rank();setBot();if(mode==="game"&&!G.history().length)say(t("c_start"),1);show(cur)}
document.addEventListener("click",function(e){
 var q=e.target.closest("[data-act],[data-p],[data-v],[data-st]");if(!q)return;ac();
 if(q.hasAttribute("data-st")){var a=q.getAttribute("data-st").split(":");prof[a[0]]=a[1];save();refresh();return}
 if(q.hasAttribute("data-act")){newGame();show("play")}
 else if(q.hasAttribute("data-p"))loadP(+q.getAttribute("data-p"));
 else{var v=q.getAttribute("data-v");if(v==="play"&&mode==="puzzle")newGame();show(v)}});
$("go").onclick=function(){prof.reg=true;save();show("home")};
$("newBtn").onclick=function(){if(mode==="puzzle")loadP(P.indexOf(pz));else newGame()};
$("hintBtn").onclick=function(){if(busy||over)return;if(mode==="puzzle"){say(t("c_phint"));return}say(t("c_hint",scored(2)[0].m.san))};
applyTheme();labels();rank();newGame();show(prof.reg?"home":"setup");
})();
